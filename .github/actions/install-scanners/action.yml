name: Install scanners
description: >
  Pinned release binaries rather than a package manager. The first attempt used
  Homebrew, which does not exist on the Ubuntu runner, and a scanner that
  silently is not there is worse than one that fails loudly.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        TRUFFLEHOG_VERSION: "3.97.1"
        GITLEAKS_VERSION: "8.30.1"
        OSV_VERSION: "2.5.1"
      run: |
        set -euo pipefail
        cd "$(mktemp -d)"
        # Retried. A release download reset by the far end failed the whole
        # step, semgrep never installed, and the job died on "command not
        # found" three steps later. The scanners are pinned, so a retry gets
        # the same bytes or none.
        get() {
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors "$@"
        }
        get "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" -o th.tar.gz
        tar -xzf th.tar.gz trufflehog
        get "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gl.tar.gz
        tar -xzf gl.tar.gz gitleaks
        get -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
        chmod +x trufflehog gitleaks osv-scanner
        sudo mv trufflehog gitleaks osv-scanner /usr/local/bin/
        pipx install semgrep
        trufflehog --version; gitleaks version; osv-scanner --version; semgrep --version
