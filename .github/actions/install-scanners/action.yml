name: Install scanners
description: >
  Pinned release binaries rather than a package manager. The first attempt used
  Homebrew, which does not exist on the Ubuntu runner, and a scanner that
  silently is not there is worse than one that fails loudly.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        TRUFFLEHOG_VERSION: "3.97.1"
        GITLEAKS_VERSION: "8.30.1"
        OSV_VERSION: "2.5.1"
      run: |
        set -euo pipefail
        cd "$(mktemp -d)"
        curl -sSfL "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" | tar -xz trufflehog
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
        curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
        chmod +x trufflehog gitleaks osv-scanner
        sudo mv trufflehog gitleaks osv-scanner /usr/local/bin/
        pipx install semgrep
        trufflehog --version; gitleaks version; osv-scanner --version; semgrep --version
