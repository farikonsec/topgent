name: Npcap SDK
description: >
  Put the Npcap SDK where the linker can find it. Windows packet capture links
  against wpcap, and the SDK is headers and import libraries only. It is not
  the driver: the driver is installed by the operator on the machine that
  captures, and Topgent never installs one.

inputs:
  target:
    description: >
      The Rust target being built. The SDK ships one import library per
      architecture and the linker takes the first it finds, so the wrong one
      first is an unresolved-symbol error rather than a helpful message.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Pinned by version and checked by digest. This is a third-party download
    # entering a build, so the URL alone is not enough: a changed file is a
    # changed build, and the job stops rather than linking against something
    # nobody looked at.
    - name: Fetch and verify the SDK
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $url    = "https://npcap.com/dist/npcap-sdk-1.16.zip"
        $sha    = "F0A8BE7778EE3AE1B99BBBECB27A3FF0F6C111A4093F1C78C5C5A099607184DB"
        $zip    = Join-Path $env:RUNNER_TEMP "npcap-sdk.zip"
        $sdk    = Join-Path $env:RUNNER_TEMP "npcap-sdk"
        $ProgressPreference = "SilentlyContinue"
        Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
        $got = (Get-FileHash $zip -Algorithm SHA256).Hash
        if ($got -ne $sha) { throw "npcap-sdk digest is $got, expected $sha" }
        Expand-Archive -Path $zip -DestinationPath $sdk -Force

    # The matching architecture first. The linker takes the first wpcap.lib on
    # the path, so an x64 import library ahead of an ARM64 build does not fail
    # with a machine-type message: it fails with a page of unresolved symbols.
    - name: Point the linker at it
      shell: pwsh
      env:
        TARGET: ${{ inputs.target }}
      run: |
        $sdk = Join-Path $env:RUNNER_TEMP "npcap-sdk"
        $arch = if ($env:TARGET -like "aarch64*") { "ARM64" } else { "x64" }
        $other = if ($arch -eq "ARM64") { "x64" } else { "ARM64" }
        $lib = "$sdk\Lib\$arch;$sdk\Lib\$other;$sdk\Lib;$env:LIB"
        "LIB=$lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "npcap sdk: $arch first"
