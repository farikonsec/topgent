name: Security

# Its own workflow so it can have its own badge. A badge that is a picture
# somebody typed is worth nothing on a security tool; this one goes red on its
# own when a scanner finds something.
#
# One job per tool. A single job running all four reported one pass or fail for
# the lot, so a reader could not tell secrets from dependencies from SAST
# without opening the log. Every job still calls scripts/scan.sh, with --only,
# so the flags a runner uses are the flags a developer uses.
#
# The weekly run is the point: an advisory published on a Tuesday should not
# wait for somebody to happen to commit.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read
  # SARIF upload. Findings land in the Security tab as alerts with a file, a
  # line and a history, instead of a line in a log nobody opens.
  security-events: write

jobs:
  secrets-trufflehog:
    name: Secrets (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-scanners
      - run: ./scripts/scan.sh --only trufflehog

  secrets-gitleaks:
    name: Secrets, including history (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks reads history, not just the tip
      - uses: ./.github/actions/install-scanners
      - run: ./scripts/scan.sh --only gitleaks
      - name: SARIF
        if: always()
        run: gitleaks detect --no-banner --redact --report-format sarif --report-path gitleaks.sarif --exit-code 0
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  dependencies-osv:
    name: Dependencies (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-scanners
      - run: ./scripts/scan.sh --only osv-scanner
      - name: SARIF
        if: always()
        run: osv-scanner scan source --config=osv-scanner.toml --format sarif --output osv.sarif . || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  sast-semgrep:
    name: Static analysis (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-scanners
      - run: ./scripts/scan.sh --only semgrep
      - name: SARIF
        if: always()
        run: semgrep --config=p/rust --config=p/security-audit --config=p/secrets --sarif --output semgrep.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # Licence and advisory policy for dependencies. Separate because it needs a
  # Rust toolchain and the scanners do not.
  deny:
    name: Dependency licences and advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
