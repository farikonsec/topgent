name: Security

# Its own workflow so it can have its own badge. A badge that is a picture
# somebody typed is worth nothing on a security tool; this one goes red on its
# own when a scanner finds something.
#
# The weekly run is the point: an advisory published on a Tuesday should not
# wait for somebody to happen to commit.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  # Runs scripts/scan.sh, the same script a developer runs locally, so the gate
  # cannot drift from what people check by hand.
  scan:
    name: Secrets, dependencies and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks reads history, not just the tip
      # Pinned release binaries rather than a package manager. The first
      # attempt used Homebrew, which does not exist on the Ubuntu runner, and a
      # scanner that silently is not there is worse than one that fails loudly.
      - name: Install scanners
        env:
          TRUFFLEHOG_VERSION: "3.97.1"
          GITLEAKS_VERSION: "8.30.1"
          OSV_VERSION: "2.5.1"
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          curl -sSfL "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" | tar -xz trufflehog
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x trufflehog gitleaks osv-scanner
          sudo mv trufflehog gitleaks osv-scanner /usr/local/bin/
          pipx install semgrep
          trufflehog --version; gitleaks version; osv-scanner --version; semgrep --version
      - run: ./scripts/scan.sh

  # Licence and advisory policy for dependencies. Separate from scan.sh because
  # it needs a Rust toolchain and the scanners do not.
  deny:
    name: Dependency licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
