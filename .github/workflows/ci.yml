name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Current stable is where the lints and the full suite run. A project that
  # only ever builds on its own floor never finds out that the language moved.
  rust:
    name: Rust contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      # Windows capture links against wpcap. The SDK is headers and import
      # libraries only, so the job builds and tests exactly what ships. The
      # driver stays the operator's and Topgent installs none.
      - name: Npcap SDK
        if: runner.os == 'Windows'
        uses: ./.github/actions/npcap-sdk
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      # Windows on ARM is a supported target and cannot be executed by the
      # x64 runner, so it is compiled rather than tested here. The release
      # workflow builds it for real.
      - name: Windows on ARM compiles
        if: runner.os == 'Windows'
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo check --workspace --locked --target aarch64-pc-windows-msvc
      - name: Interface alert rules and shipped/development parity
        shell: bash
        run: |
          set -eu
          node --check viewer/serve.mjs
          node --test viewer/*.test.mjs
      - name: Exercise report, health and AI-BOM surfaces
        shell: bash
        run: |
          set -eu
          if [ "$RUNNER_OS" = Windows ]; then
            binary=target/release/topgent.exe
          else
            binary=target/release/topgent
          fi
          "$binary" --json > topgent-report.json
          "$binary" doctor --json > topgent-doctor.json || true
          "$binary" export cyclonedx --output topgent.cdx.json
          "$binary" export cyclonedx --format html --output topgent-aibom.html
          test -s topgent-report.json
          test -s topgent-doctor.json
          test -s topgent.cdx.json
          test -s topgent-aibom.html
      - name: Exercise offline CI-policy fixture matrix
        shell: bash
        run: |
          set -eu
          if [ "$RUNNER_OS" = Windows ]; then
            binary=target/release/topgent.exe
          else
            binary=target/release/topgent
          fi
          fixtures=crates/topgent-cli/tests/fixtures/policy
          "$binary" policy check --input "$fixtures/pass/topgent-report.json" --require-coverage --json
          check_exit() {
            expected=$1
            shift
            set +e
            "$binary" policy check --input "$fixtures/$1/topgent-report.json" --require-coverage --json >/dev/null 2>&1
            actual=$?
            set -e
            test "$actual" = "$expected"
          }
          check_exit 1 violation
          check_exit 3 incomplete
          check_exit 2 error

  # The eBPF probe, on Linux x86-64: built with its pinned nightly and
  # bpf-linker, linted, and its root-only tests run under sudo, which hosted
  # runners allow. The lab VM is arm64, so this is where the x86-64 syscall
  # table and a second kernel are exercised (docs/ebpf/PLAN.md, E6).
  ebpf:
    name: eBPF probe (Linux x86-64)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      FEATURES: topgent-sensor/ebpf,topgent-ebpf/probe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The nightly the probe pins, and LLVM of the same major for bpf-linker.
      # Move them together (crates/topgent-ebpf-probe/rust-toolchain.toml).
      - name: Probe toolchain
        run: |
          set -eu
          rustup toolchain install nightly-2026-07-01 --profile minimal --component rust-src
          rustc +nightly-2026-07-01 -vV | grep 'LLVM version: 22'
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev libzstd-dev zlib1g-dev bpftool
          PATH=/usr/lib/llvm-22/bin:$PATH cargo install bpf-linker@0.11.1 --locked --no-default-features --features llvm-22
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo clippy --workspace --all-targets --locked --features "$FEATURES" -- -D warnings
      - run: cargo test --workspace --locked --features "$FEATURES"
      - name: Root-only probe tests
        run: |
          set -eu
          for test in load events syscalls; do
            binary=$(cargo test -p topgent-ebpf --features probe --test "$test" --no-run --locked \
              --message-format=json | jq -r 'select(.executable != null) | .executable')
            sudo "$binary" --ignored --nocapture
          done

  # The floor the README promises. Build and test only: Clippy's lint set moves
  # between releases, and failing the oldest supported compiler over a lint that
  # did not exist when it shipped would say nothing about whether the code runs.
  #
  # 1.88 is where let-chains stabilised, and the collectors use them in 146
  # places. The manifests claimed 1.85 until this job proved otherwise.
  #
  # The floor is 1.95 now, and it is not ours: sysinfo 0.39.6 requires it, and
  # that version is the one whose process enumeration works on Windows on ARM.
  # Holding 1.88 would mean giving that back, so the number moved instead. This
  # job is what caught the manifests still claiming the old one.
  msrv:
    name: Minimum supported Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2.9.2
      # Windows capture links against wpcap. The SDK is headers and import
      # libraries only, so the job builds and tests exactly what ships. The
      # driver stays the operator's and Topgent installs none.
      - name: Npcap SDK
        if: runner.os == 'Windows'
        uses: ./.github/actions/npcap-sdk
      - run: cargo test --workspace --locked
