[package]
name = "topgent-report"
description = "Orchestrates a sweep into the one JSON shape every front end consumes: CLI, viewer, and the desktop app."
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
topgent-behaviour = { path = "../topgent-behaviour" }
topgent-core = { path = "../topgent-core" }
topgent-policy = { path = "../topgent-policy" }
topgent-facts = { path = "../topgent-facts" }
topgent-collect = { path = "../topgent-collect" }
topgent-enforce = { path = "../topgent-enforce" }
topgent-journal = { path = "../topgent-journal" }
topgent-export = { path = "../topgent-export" }
topgent-evidence = { path = "../topgent-evidence" }
serde_json = "1"
getrandom = "0.4"

[build-dependencies]
# Build-time only: expand the vendored ownership table into the compact binary
# representation embedded in reports. Builds never fetch network data.
flate2 = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
topgent-core = { path = "../topgent-core" }
topgent-policy = { path = "../topgent-policy" }

[lints]
workspace = true
