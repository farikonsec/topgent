[package]
name = "topgent-collect"
description = "Collectors: untrusted, replaceable, and the only part of Topgent that touches the operating system."
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
topgent-facts = { path = "../topgent-facts" }
topgent-policy = { path = "../topgent-policy" }
sysinfo = { version = "0.39", default-features = false, features = ["system", "user"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }
