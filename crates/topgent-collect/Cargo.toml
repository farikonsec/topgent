[package]
name = "topgent-collect"
description = "Collectors: untrusted, replaceable, and the only part of Topgent that touches the operating system."
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
etherparse = { version = "0.21", default-features = false, features = ["std"] }
topgent-facts = { path = "../topgent-facts" }
topgent-policy = { path = "../topgent-policy" }
sysinfo = { version = "0.39", default-features = false, features = ["system", "user"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
etherparse = { version = "0.21", default-features = false, features = ["std"] }

[lints]
workspace = true

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process", "std"] }

# Packet capture is a Linux capability in this build, so the socket wrapper is
# a Linux dependency. `all` is what gates the packet-socket constants; without
# it the domain and type this needs are not named.
[target."cfg(target_os = \"linux\")".dependencies]
socket2 = { version = "0.6", default-features = false, features = ["all"] }

# macOS ships libpcap and its headers in the system SDK, so linking it needs
# nothing a Mac does not already have. The unprivileged alternative is `ioctl`
# on /dev/bpf*, which needs unsafe code this crate forbids.
[target."cfg(target_os = \"macos\")".dependencies]
pcap = "2"

# Windows capture goes through Npcap, which presents the same API.
#
# Always built, never optional. A feature flag would mean the Windows job in
# continuous integration compiled a different program from the one released,
# so the capture code would ship untested on the platform it is hardest to get
# right. The build machines get the SDK instead, which is headers and import
# libraries and about a megabyte.
#
# The SDK is not the driver. The driver is the operator's, installed from
# Npcap's own signed installer, and the library is delay loaded so a machine
# without it runs Topgent normally and reports capture as unsupported.
[target."cfg(windows)".dependencies]
pcap = "2"
