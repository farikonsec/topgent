[package]
name = "topgent-ui"
description = "The Topgent desktop interface. A projection of one report, drawn natively."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dev-dependencies]
# Test-only. The interface deliberately takes grades as strings from the
# report, so it does not link the core at runtime; the guard below needs the
# real band list to notice when one is added and not given a colour.
topgent-core = { path = "../topgent-core" }

[lints]
workspace = true

[dependencies]
topgent-report = { path = "../topgent-report" }
iced = { version = "0.14", features = ["tokio", "advanced", "svg", "image", "lazy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[build-dependencies]
# Build-time only. The published table is vendored gzipped and decompressed
# here; nothing from this crate reaches the shipped binary.
flate2 = "1"
# Also build-time only. The icon is decoded once here rather than shipping an
# image decoder to draw one unchanging square.
png = "0.18"

[target.'cfg(windows)'.build-dependencies]
# Links the icon in as a resource, which is the only thing Explorer, the
# taskbar and the notification centre read.
winresource = "0.1"

[lib]
name = "topgent_ui"
path = "src/lib.rs"

[[bin]]
name = "topgent-ui"
path = "src/main.rs"
