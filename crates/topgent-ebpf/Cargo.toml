[package]
name = "topgent-ebpf"
description = "Topgent's eBPF source on Linux: loads its own kernel probe, and says plainly when it cannot."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Build and embed the kernel probe. Off by default: it needs the pinned nightly
# and `bpf-linker` (see crates/topgent-ebpf-probe/rust-toolchain.toml), which
# ordinary development and CI on stable do not have. Without it, `load` says
# the build carries no probe and Topgent keeps reading Linux Audit.
probe = []

[dependencies]
topgent-ebpf-common = { path = "../topgent-ebpf-common" }

# Linux only. macOS and Windows never download or link it.
[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.14.0", default-features = false }

[lints]
workspace = true

[[test]]
name = "load"
path = "tests/load.rs"

[[test]]
name = "events"
path = "tests/events.rs"

[[test]]
name = "syscalls"
path = "tests/syscalls.rs"

[[example]]
name = "probe-check"
path = "examples/probe_check.rs"
required-features = ["probe"]
