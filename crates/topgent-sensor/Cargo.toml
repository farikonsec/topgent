[package]
name = "topgent-sensor"
description = "Reads process lifecycle from the kernel (Topgent's eBPF probe, else the process connector) and hands over fork, exec and exit, one JSON line each. The only part that holds kernel privileges."
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "topgent-sensor"
path = "src/main.rs"

[dependencies]
topgent-collect = { path = "../topgent-collect" }
serde_json = "1"

[features]
# Embed Topgent's eBPF probe. Off by default for the same reason as in
# topgent-ebpf: it needs the pinned nightly and bpf-linker. Without it the
# sensor uses the process connector and says so in every health line.
ebpf = ["topgent-ebpf/probe"]

[target.'cfg(target_os = "linux")'.dependencies]
topgent-ebpf = { path = "../topgent-ebpf" }
rustix = { version = "1.1.4", default-features = false, features = ["std", "time"] }

[lints]
workspace = true
